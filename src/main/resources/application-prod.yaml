server:
  port: 80

spring:
  config:
    activate:
      on-profile: prod

  # AWS RDS MySQL
  datasource:
    url: ${DB_URL} # RDS 인스턴스 엔드포인트
    username: ${DB_USERNAME} # RDS 마스터 사용자 이름
    password: ${DB_PASSWORD} # RDS 마스터 암호
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true

  # S3에 업로드 연결 설정
  cloud:
    aws:
      credentials:
        access-key: ${AWS_ACCESS_KEY} # IAM 통해서 발급받은 액세스 키
        secret-key: ${AWS_SECRET_KEY} # IAM 통해서 발급받은 비밀 액세스 키
      s3:
        bucket: ${S3_BUCKET} # 생성한 S3 버킷명
      region:
        static: ap-northeast-2