<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="common-styles">
    <style>
        /* 프로필 사진 공통 스타일 */
        .profile-pic-default {
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
            color: white;
            font-weight: bold;
            border-radius: 50%;
        }

        .profile-pic-default.size-small {
            width: 40px;
            height: 40px;
            font-size: 16px;
        }

        .profile-pic-default.size-medium {
            width: 50px;
            height: 50px;
            font-size: 18px;
        }

        .profile-pic-default.size-large {
            width: 150px;
            height: 150px;
            font-size: 60px;
        }

        .profile-pic-img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
        }

        /* 게시물 기본 이미지 스타일 */
        .post-image-default {
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 48px;
        }

        .post-image-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
    </style>
</head>
</html>
