<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>서버 오류</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
            background: #fafafa;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }
        .error-container {
            text-align: center;
            padding: 40px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.1);
            max-width: 500px;
        }
        .error-code {
            font-size: 80px;
            font-weight: bold;
            color: #ed4956;
            margin-bottom: 20px;
        }
        .error-title {
            font-size: 24px;
            font-weight: 600;
            color: #262626;
            margin-bottom: 12px;
        }
        .error-message {
            font-size: 14px;
            color: #8e8e8e;
            margin-bottom: 30px;
            line-height: 1.5;
        }
        .home-btn {
            display: inline-block;
            padding: 12px 32px;
            background: #0095f6;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            transition: background 0.2s;
        }
        .home-btn:hover {
            background: #1877f2;
        }
    </style>
</head>
<body>
<div class="error-container">
    <div class="error-code">500</div>
    <div class="error-title">서버 오류가 발생했습니다</div>
    <div class="error-message">
        일시적인 오류가 발생했습니다.<br>
        잠시 후 다시 시도해주세요.
    </div>
    <a href="/" class="home-btn">홈으로 돌아가기</a>
</div>
</body>
</html>
