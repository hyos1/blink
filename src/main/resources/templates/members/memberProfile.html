<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blink - 프로필</title>

    <!-- 공통 스타일 포함 -->
    <th:block th:replace="~{fragments/styles :: common-styles}"></th:block>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
            background: #fafafa;
        }

        /* 상단바 */
        .top-bar {
            background: white;
            border-bottom: 1px solid #dbdbdb;
            padding: 12px 0;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .top-bar-content {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            font-size: 28px;
            font-weight: bold;
            background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            cursor: pointer;
        }

        .top-actions {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .icon-btn {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .icon-btn:hover {
            transform: scale(1.1);
        }

        /* 프로필 컨테이너 */
        .profile-container {
            max-width: 935px;
            margin: 40px auto;
            padding: 0 20px;
        }

        /* 프로필 헤더 */
        .profile-header {
            display: flex;
            gap: 40px;
            margin-bottom: 44px;
            padding-bottom: 44px;
            border-bottom: 1px solid #dbdbdb;
        }

        .profile-pic-large {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            cursor: pointer;
            transition: transform 0.2s;
            overflow: hidden;
        }

        .profile-pic-large:hover {
            transform: scale(1.05);
        }

        .profile-info {
            flex: 1;
        }

        .profile-top {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 20px;
        }

        .profile-username {
            font-size: 20px;
            font-weight: 300;
            color: #262626;
        }

        .edit-profile-btn,
        .follow-btn {
            padding: 8px 16px;
            border: 1px solid #dbdbdb;
            border-radius: 8px;
            background: white;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .edit-profile-btn:hover,
        .follow-btn:hover {
            background: #fafafa;
        }

        .follow-btn {
            background: #0095f6;
            color: white;
            border: none;
        }

        .follow-btn:hover {
            background: #1877f2;
        }

        .follow-btn.following {
            background: white;
            color: #262626;
            border: 1px solid #dbdbdb;
        }

        .profile-stats {
            display: flex;
            gap: 40px;
            margin-bottom: 20px;
        }

        .stat {
            font-size: 16px;
            color: #262626;
        }

        .stat-number {
            font-weight: 600;
        }

        .profile-bio {
            max-width: 500px;
        }

        .profile-description {
            font-size: 14px;
            color: #262626;
            line-height: 1.5;
            white-space: pre-wrap;
        }

        /* 탭 메뉴 */
        .tabs {
            display: flex;
            justify-content: center;
            border-top: 1px solid #dbdbdb;
            margin-bottom: 20px;
        }

        .tab {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 16px 0;
            margin: 0 30px;
            font-size: 12px;
            font-weight: 600;
            color: #8e8e8e;
            cursor: pointer;
            border-top: 1px solid transparent;
            margin-top: -1px;
            transition: color 0.2s;
        }

        .tab:hover {
            color: #262626;
        }

        .tab.active {
            color: #262626;
            border-top-color: #262626;
        }

        .tab-icon {
            font-size: 14px;
        }

        /* 게시물 그리드 */
        .posts-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 28px;
        }

        .post-item {
            position: relative;
            aspect-ratio: 1;
            background: #f0f0f0;
            cursor: pointer;
            overflow: hidden;
            border-radius: 4px;
        }

        .post-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 30px;
            opacity: 0;
            transition: opacity 0.2s;
        }

        .post-item:hover .post-overlay {
            opacity: 1;
        }

        .post-stat {
            display: flex;
            align-items: center;
            gap: 8px;
            color: white;
            font-weight: 600;
            font-size: 16px;
        }

        /* 빈 상태 */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
        }

        .empty-icon {
            font-size: 80px;
            margin-bottom: 20px;
            opacity: 0.3;
        }

        .empty-title {
            font-size: 28px;
            font-weight: 300;
            color: #262626;
            margin-bottom: 10px;
        }

        .empty-description {
            font-size: 14px;
            color: #8e8e8e;
            margin-bottom: 20px;
        }

        .empty-btn {
            padding: 8px 24px;
            background: #0095f6;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .empty-btn:hover {
            background: #1877f2;
        }

        /* 반응형 */
        @media (max-width: 768px) {
            .profile-header {
                gap: 20px;
            }

            .profile-pic-large {
                width: 100px;
                height: 100px;
            }

            .profile-pic-large .profile-pic-default {
                font-size: 40px;
            }

            .profile-top {
                flex-direction: column;
                align-items: flex-start;
            }

            .profile-stats {
                gap: 20px;
            }

            .posts-grid {
                grid-template-columns: repeat(3, 1fr);
                gap: 4px;
            }

            .tab {
                margin: 0 15px;
            }
        }

        /* 게시물, 팔로우, 팔로워 모달 창 스타일 추가 */

        /* 모달 공통 */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal-overlay.active {
            display: flex;
        }

        /* 게시물 모달 */
        .post-modal-container {
            position: relative;
            background: white;
            border-radius: 4px;
            max-width: 90vw;
            max-height: 90vh;
            display: flex;
        }

        .post-modal-close {
            position: absolute;
            top: -40px;
            right: 0;
            background: none;
            border: none;
            color: white;
            font-size: 36px;
            cursor: pointer;
            z-index: 10;
        }

        .post-modal-content {
            display: flex;
            width: 100%;
            max-height: 90vh;
        }

        .post-modal-image-section {
            background: black;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-width: 400px;
            max-width: 60vw;
            position: relative;
        }

        .post-modal-slider {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-slider-wrapper {
            display: flex;
            transition: transform 0.3s ease;
            height: 100%;
        }

        .modal-slider-wrapper img {
            min-width: 100%;
            max-height: 80vh;
            object-fit: contain;
        }

        .modal-slider-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255, 255, 255, 0.9);
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            font-size: 24px;
            cursor: pointer;
            display: none;
            z-index: 10;
        }

        .modal-slider-btn.show {
            display: block;
        }

        .modal-slider-prev {
            left: 10px;
        }

        .modal-slider-next {
            right: 10px;
        }

        .modal-slider-indicator {
            position: absolute;
            bottom: 10px;
            color: white;
            font-size: 12px;
            background: rgba(0, 0, 0, 0.5);
            padding: 4px 12px;
            border-radius: 12px;
        }

        .post-modal-info-section {
            width: 400px;
            display: flex;
            flex-direction: column;
            background: white;
        }

        .post-modal-header {
            padding: 16px;
            border-bottom: 1px solid #efefef;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .post-modal-author {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .post-modal-author-pic {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            object-fit: cover;
        }

        .post-modal-author-name {
            font-weight: 600;
            font-size: 14px;
            color: #262626;
            cursor: pointer;
        }

        .post-modal-more {
            background: none;
            border: none;
            font-size: 20px;
            cursor: pointer;
        }

        .post-modal-body {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
        }

        .post-modal-caption {
            display: flex;
            gap: 12px;
            margin-bottom: 16px;
            padding-bottom: 16px;
            border-bottom: 1px solid #efefef;
        }

        .post-modal-text {
            font-size: 14px;
            color: #262626;
        }

        .post-modal-comments {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .post-modal-footer {
            border-top: 1px solid #efefef;
        }

        .post-modal-actions {
            display: flex;
            gap: 16px;
            padding: 12px 16px;
        }

        .post-modal-action-btn {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
        }

        .post-modal-likes {
            padding: 0 16px 8px;
            font-weight: 600;
            font-size: 14px;
        }

        .post-modal-date {
            padding: 0 16px 12px;
            font-size: 12px;
            color: #8e8e8e;
        }

        .post-modal-comment-input {
            border-top: 1px solid #efefef;
            padding: 16px;
            display: flex;
            gap: 12px;
        }

        .post-modal-comment-input input {
            flex: 1;
            border: none;
            outline: none;
            font-size: 14px;
        }

        .post-modal-post-btn {
            background: none;
            border: none;
            color: #0095f6;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
        }

        /* 팔로우 모달 */
        .follow-modal-container {
            background: white;
            border-radius: 12px;
            width: 90%;
            max-width: 400px;
            max-height: 400px;
            display: flex;
            flex-direction: column;
        }

        .follow-modal-header {
            padding: 16px 20px;
            border-bottom: 1px solid #dbdbdb;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .follow-modal-title {
            font-size: 16px;
            font-weight: 600;
        }

        .follow-modal-close {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: #8e8e8e;
        }

        .follow-modal-body {
            flex: 1;
            overflow-y: auto;
            padding: 8px 0;
        }

        .follow-item {
            display: flex;
            align-items: center;
            padding: 8px 16px;
            gap: 12px;
        }

        .follow-item:hover {
            background: #fafafa;
        }

        .follow-avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            overflow: hidden;
        }

        .follow-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .follow-info {
            flex: 1;
        }

        .follow-username {
            font-weight: 600;
            font-size: 14px;
            color: #262626;
            cursor: pointer;
        }

        .follow-name {
            font-size: 14px;
            color: #8e8e8e;
        }

        .follow-btn-small {
            padding: 7px 16px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            border: none;
            background: #0095f6;
            color: white;
            cursor: pointer;
        }

        .follow-btn-small.following {
            background: #efefef;
            color: #262626;
        }

        /* 여기까지 추가 */
    </style>
</head>
<body>
<!-- 상단바 -->
<div class="top-bar">
    <div class="top-bar-content">
        <div class="logo" th:onclick="|location.href='/'|">Blink</div>
        <div class="top-actions">
            <button class="icon-btn" th:onclick="|location.href='/'|">🏠</button>
            <!-- 본인 프로필이면 게시물 추가 버튼 표시 -->
            <button th:if="${profile.isMyProfile}"
                    class="icon-btn"
                    th:onclick="|location.href='@{/posts/add}'|">➕</button>
            <button class="icon-btn">💬</button>
            <button class="icon-btn">🔔</button>
        </div>
    </div>
</div>

<!-- 프로필 컨테이너 -->
<div th:object="${profile}" class="profile-container">
    <!-- 프로필 헤더 -->
    <div class="profile-header">
        <!-- 프로필 사진 -->
        <div class="profile-pic-large">
            <img th:if="*{profileImageUrl != null}"
                 th:src="*{profileImageUrl}"
                 class="profile-pic-img" alt="프로필 사진">

            <img th:unless="*{profileImageUrl != null}"
                 th:src="@{/images/default-profile.svg}"
                 class="profile-pic-img" alt="기본 프로필 사진">
        </div>

        <div class="profile-info">
            <div class="profile-top">
                <h1 th:text="*{name}" class="profile-username">hong_gildong</h1>

                <!-- 본인 프로필일 때 -->
                <button th:if="*{isMyProfile}" class="edit-profile-btn"
                        th:onclick="|location.href='@{/members/profile/edit}'|">프로필 편집
                </button>
                <button th:if="*{isMyProfile}" class="icon-btn"
                        th:onclick="|location.href='/settings'|">⚙️
                </button>

                <!-- 다른 사람 프로필일 때 -->
                <form th:unless="*{isMyProfile}"
                      th:action="@{/follows/{id}(id=*{id})}" method="post"
                      style="display: inline;">
                    <button type="submit" class="follow-btn"
                            th:classappend="*{isFollowing} ? 'following' : ''"
                            th:text="*{isFollowing} ? '팔로잉' : '팔로우'"
                    >팔로우
                    </button>
                </form>
                <button th:unless="*{isMyProfile}" class="icon-btn">
                    ⋯
                </button>
            </div>

            <div class="profile-stats">
                <div class="stat">
                    게시물 <span class="stat-number" th:text="*{postCount}">42</span>
                </div>
                <div class="stat" style="cursor: pointer;" onclick="openFollowersModal()">
                    팔로워 <span class="stat-number" th:text="*{followerCount}">1,234</span>
                </div>
                <div class="stat" style="cursor: pointer;" onclick="openFollowingModal()">
                    팔로우 <span class="stat-number" th:text="*{followingCount}">567</span>
                </div>
            </div>

            <div class="profile-bio">
                <div class="profile-description"
                     th:text="*{bio != null ? bio : '자기소개가 없습니다.'}">안녕하세요😊
                </div>
            </div>
        </div>
    </div>

    <!-- 탭 메뉴 -->
    <div class="tabs">
        <div class="tab active" onclick="showTab('posts')">
            <span class="tab-icon">📱</span>
            <span>게시물</span>
        </div>
        <div class="tab" onclick="showTab('saved')">
            <span class="tab-icon">🔖</span>
            <span>저장됨</span>
        </div>
        <div class="tab" onclick="showTab('tagged')">
            <span class="tab-icon">👤</span>
            <span>태그됨</span>
        </div>
    </div>

    <!-- 게시물 탭 -->
    <div id="postsTab" class="tab-content">

        <!-- 게시물이 있을 때 -->
        <div class="posts-grid" th:unless="${#lists.isEmpty(posts)}">
            <div th:each="post : ${posts}" class="post-item"
                 th:onclick="|openPostModal(${post.id})|">

                <!--이미지 있으면 표시-->
                <img th:if="post.imageUrl != null"
                     th:src="@{${post.imageUrl}}" alt="게시물 이미지" class="post-image-img">

                <!--이미지 없으면 기본 아이콘 표시-->
                <div th:unless="${post.imageUrl != null}" class="post-image-default">
                    📸
                </div>

                <div class="post-overlay">
                    <div class="post-stat">
                        <span>❤️</span>
                        <span th:text="${post.likeCount}">1,234</span>
                    </div>
                    <div class="post-stat">
                        <span>💬</span>
                        <span th:text="${post.commentCount}">56</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- 게시물이 없을 때 -->
        <div th:if="${#lists.isEmpty(posts)}" class="empty-state">
            <div class="empty-icon">📷</div>
            <div class="empty-title">게시물 없음</div>
            <div class="empty-description">
                <span th:if="${profile.isMyProfile}">
                    게시물을 공유하면 회원님의 프로필에 표시됩니다.
                </span>
                <span th:unless="${profile.isMyProfile}">
                    아직 게시물이 없습니다.
                </span>
            </div>
            <button th:if="${profile.isMyProfile}"
                    th:onclick="|location.href='@{/posts/add}'|"
                    class="empty-btn">
                첫 게시물 공유하기
            </button>
        </div>
    </div>

    <!-- 저장됨 탭 -->
    <div id="savedTab" class="tab-content" style="display: none;">
        <div class="empty-state">
            <div class="empty-icon">🔖</div>
            <div class="empty-title">저장한 게시물이 없습니다</div>
            <div class="empty-description">마음에 드는 게시물을 저장하면 여기에 표시됩니다.</div>
        </div>
    </div>

    <!-- 태그됨 탭 -->
    <div id="taggedTab" class="tab-content" style="display: none;">
        <div class="empty-state">
            <div class="empty-icon">👤</div>
            <div class="empty-title">태그된 게시물이 없습니다</div>
            <div class="empty-description">회원님이 태그된 사진과 동영상이 여기에 표시됩니다.</div>
        </div>
    </div>
</div>

<script th:inline="javascript">

    // Thymeleaf에서 JavaScript 변수로 주입
    const profileMemberId = [[${profile.id}]];
    const loginMemberId = [[${session.loginMember.id}]];

    function showTab(tabName) {
        const tabs = document.querySelectorAll('.tab');
        tabs.forEach(tab => tab.classList.remove('active'));

        document.getElementById('postsTab').style.display = 'none';
        document.getElementById('savedTab').style.display = 'none';
        document.getElementById('taggedTab').style.display = 'none';

        event.currentTarget.classList.add('active');

        if (tabName === 'posts') {
            document.getElementById('postsTab').style.display = 'block';
        } else if (tabName === 'saved') {
            document.getElementById('savedTab').style.display = 'block';
        } else if (tabName === 'tagged') {
            document.getElementById('taggedTab').style.display = 'block';
        }
    }

    // 게시물 모달 관련
    let currentPostId = null;
    let modalCurrentIndex = 0;
    let modalImageCount = 0;
    let modalImages = [];

    // 게시물 모달 열기
    async function openPostModal(postId) {
        currentPostId = postId;

        try {
            const response = await fetch(`/api/posts/${postId}`);
            if (!response.ok) {
                throw new Error('게시물을 불러올 수 없습니다.');
            }

            const data = await response.json();

            // 작성자 정보
            document.getElementById('modalAuthorImage').src = data.authorProfileImage || '/images/default-profile.svg';
            document.getElementById('modalAuthorName').textContent = data.authorName;
            document.getElementById('modalCaptionImage').src = data.authorProfileImage || '/images/default-profile.svg';
            document.getElementById('modalCaptionName').textContent = data.authorName;

            // 게시물 내용
            document.getElementById('modalContent').textContent = data.content;
            document.getElementById('modalLikeCount').textContent = data.likeCount;
            document.getElementById('modalDate').textContent = formatDate(data.createdAt);

            // 이미지 로드
            modalImages = data.imageUrls;
            modalImageCount = modalImages.length;
            modalCurrentIndex = 0;

            const modalSliderWrapper = document.getElementById('modalSliderWrapper');
            modalSliderWrapper.innerHTML = '';
            modalImages.forEach(imageUrl => {
                const img = document.createElement('img');
                img.src = imageUrl;
                modalSliderWrapper.appendChild(img);
            });

            updateModalSlider();

            // 좋아요 버튼 상태
            const likeBtn = document.querySelector('.post-modal-action-btn');
            if (data.likedByMe) {
                likeBtn.textContent = '♥';
                likeBtn.style.color = '#ed4956';
            } else {
                likeBtn.textContent = '♡';
                likeBtn.style.color = '';
            }

            // 댓글 로드
            loadComments(data.comments);

            // 본인 게시물이면 삭제 버튼 표시
            const moreBtn = document.querySelector('.post-modal-more');
            if (data.myPost) {
                moreBtn.style.display = 'block';
                moreBtn.onclick = () => showDeletePostMenu();
            } else {
                moreBtn.style.display = 'none';
            }

            // 모달 열기
            document.getElementById('postModal').classList.add('active');
            document.body.style.overflow = 'hidden';

        } catch (error) {
            console.error('게시물 로딩 실패:', error);
            alert('게시물을 불러올 수 없습니다.');
        }
    }

    // 게시물 삭제 메뉴 표시
    function showDeletePostMenu() {
        if (confirm('게시물을 삭제하시겠습니까?')) {
            deletePost();
        }
    }

    // 게시물 삭제
    async function deletePost() {
        if (!currentPostId) return;

        try {
            const response = await fetch(`/api/posts/${currentPostId}`, {
                method: 'DELETE'
            });

            if (!response.ok) throw new Error('삭제 실패');

            alert('게시물이 삭제되었습니다.');
            closePostModal();
            location.reload(); // 프로필 페이지 새로고침

        } catch (error) {
            console.error('삭제 실패:', error);
            alert('게시물 삭제 중 오류가 발생했습니다.');
        }
    }


    // 게시물 모달 닫기
    function closePostModal(event) {
        if (event && event.target !== event.currentTarget) return;
        document.getElementById('postModal').classList.remove('active');
        document.body.style.overflow = '';
    }

    // 모달 슬라이더 이동
    function moveModalSlide(direction) {
        modalCurrentIndex += direction;
        if (modalCurrentIndex < 0) modalCurrentIndex = 0;
        if (modalCurrentIndex >= modalImageCount) modalCurrentIndex = modalImageCount - 1;
        updateModalSlider();
    }

    // 모달 슬라이더 업데이트
    function updateModalSlider() {
        const wrapper = document.getElementById('modalSliderWrapper');
        wrapper.style.transform = `translateX(-${modalCurrentIndex * 100}%)`;

        const indicator = document.getElementById('modalSliderIndicator');
        indicator.textContent = modalImageCount > 1 ? `${modalCurrentIndex + 1} / ${modalImageCount}` : '';

        const prevBtn = document.getElementById('modalPrevBtn');
        const nextBtn = document.getElementById('modalNextBtn');

        if (modalImageCount > 1) {
            prevBtn.classList.toggle('show', modalCurrentIndex > 0);
            nextBtn.classList.toggle('show', modalCurrentIndex < modalImageCount - 1);
        }
    }

    // 댓글 로드
    function loadComments(comments) {
        const container = document.getElementById('modalComments');

        if (!comments || comments.length === 0) {
            container.innerHTML = '';
            return;
        }

        container.innerHTML = comments.map(comment => `
            <div class="post-modal-comment" style="display: flex; gap: 12px; position: relative;">
                <img src="${comment.authorProfileImage || '/images/default-profile.svg'}"
                     class="post-modal-author-pic"
                     alt="프로필">
                <div style="flex: 1;">
                    <span class="post-modal-author-name">${comment.authorName}</span>
                    <span class="post-modal-text"> ${comment.content}</span>
                    <div style="font-size: 12px; color: #8e8e8e; margin-top: 4px;">
                        ${formatDate(comment.createdAt)}
                    </div>
                </div>
                ${comment.myComment ? `
                    <button onclick="deleteComment(${comment.commentId})"
                            style="background: none; border: none; color: #ed4956; cursor: pointer; font-size: 12px;">
                        삭제
                    </button>
                ` : ''}
            </div>
        `).join('');
    }

    // 댓글 삭제
    async function deleteComment(commentId) {
        if (!confirm('댓글을 삭제하시겠습니까?')) return;

        try {
            const response = await fetch(`/api/posts/${currentPostId}/comments/${commentId}`, {
                method: 'DELETE'
            });

            if (!response.ok) throw new Error('삭제 실패');

            // 모달 새로고침
            openPostModal(currentPostId);

        } catch (error) {
            console.error('댓글 삭제 실패:', error);
            alert('댓글 삭제 중 오류가 발생했습니다.');
        }
    }

    // 날짜 포맷팅
    function formatDate(dateString) {
        const date = new Date(dateString);
        const now = new Date();
        const diff = Math.floor((now - date) / 1000);

        if (diff < 60) return '방금 전';
        if (diff < 3600) return `${Math.floor(diff / 60)}분 전`;
        if (diff < 86400) return `${Math.floor(diff / 3600)}시간 전`;
        if (diff < 604800) return `${Math.floor(diff / 86400)}일 전`;

        return date.toLocaleDateString('ko-KR');
    }

    // 팔로워 모달 열기
    async function openFollowersModal() {
        document.getElementById('followModalTitle').textContent = '팔로워';

        try {
            const response = await fetch(`/api/follows/${profileMemberId}/followers`);
            if (!response.ok) throw new Error('팔로워 목록을 불러올 수 없습니다.');

            const followers = await response.json();
            renderFollowList(followers);

        } catch (error) {
            console.error('팔로워 로딩 실패:', error);
            document.getElementById('followModalBody').innerHTML =
                '<div style="padding: 40px; text-align: center; color: #8e8e8e;">팔로워를 불러올 수 없습니다.</div>';
        }

        document.getElementById('followModal').classList.add('active');
        document.body.style.overflow = 'hidden';
    }

    // 팔로잉 모달 열기
    async function openFollowingModal() {
        document.getElementById('followModalTitle').textContent = '팔로잉';

        try {
            const response = await fetch(`/api/follows/${profileMemberId}/followings`);
            if (!response.ok) throw new Error('팔로잉 목록을 불러올 수 없습니다.');

            const followings = await response.json();
            renderFollowList(followings);

        } catch (error) {
            console.error('팔로잉 로딩 실패:', error);
            document.getElementById('followModalBody').innerHTML =
                '<div style="padding: 40px; text-align: center; color: #8e8e8e;">팔로잉을 불러올 수 없습니다.</div>';
        }

        document.getElementById('followModal').classList.add('active');
        document.body.style.overflow = 'hidden';
    }

    // 팔로우 목록 렌더링
    function renderFollowList(users) {
        const container = document.getElementById('followModalBody');

        if (!users || users.length === 0) {
            container.innerHTML = '<div style="padding: 40px; text-align: center; color: #8e8e8e;">목록이 없습니다.</div>';
            return;
        }

        container.innerHTML = users.map(user => `
            <div class="follow-item">
                <div class="follow-avatar">
                    <img src="${user.profileImageUrl || '/images/default-profile.svg'}" alt="프로필">
                </div>
                <div class="follow-info">
                    <div class="follow-username" onclick="location.href='/members/profile/${user.name}'">
                        ${user.name}
                    </div>
                </div>
                ${user.memberId !== loginMemberId ? `
                    <button class="follow-btn-small ${user.followByMe ? 'following' : ''}"
                            onclick="toggleFollowInModal(${user.memberId}, this)">
                        ${user.followByMe ? '팔로잉' : '팔로우'}
                    </button>
                ` : ''}
            </div>
        `).join('');
    }

    // 모달 내 팔로우 토글
    async function toggleFollowInModal(userId, button) {
        try {
            const response = await fetch(`/api/follows/${userId}`, {
                method: 'POST'
            });

            if (!response.ok) throw new Error('팔로우 처리 실패');

            const data = await response.json();

            // 버튼 상태 업데이트
            if (data.isFollowing) {
                button.classList.add('following');
                button.textContent = '팔로잉';
            } else {
                button.classList.remove('following');
                button.textContent = '팔로우';
            }

        } catch (error) {
            console.error('팔로우 토글 실패:', error);
            alert('팔로우 처리 중 오류가 발생했습니다.');
        }
    }

    function closeFollowModal(event) {
        if (event && event.target !== event.currentTarget) return;
        document.getElementById('followModal').classList.remove('active');
        document.body.style.overflow = '';
    }

    // ESC 키로 닫기
    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
            closePostModal();
            closeFollowModal();
        }
    });

        // 좋아요 토글
    async function togglePostLike() {
        if (!currentPostId) return;

        try {
            const response = await fetch(`/api/posts/${currentPostId}/like`, {
                method: 'POST'
            });

            if (!response.ok) throw new Error('좋아요 처리 실패');

            const data = await response.json();

            // 좋아요 수 업데이트
            document.getElementById('modalLikeCount').textContent = data.likeCount;

            // 버튼 상태 변경
            const likeBtn = document.querySelector('.post-modal-action-btn');
            if (data.likedByMe) {
                likeBtn.textContent = '♥';
                likeBtn.style.color = '#ed4956';
            } else {
                likeBtn.textContent = '♡';
                likeBtn.style.color = '';
            }

        } catch (error) {
            console.error('좋아요 실패:', error);
            alert('좋아요 처리 중 오류가 발생했습니다.');
        }
    }

    // 댓글 추가
    async function addComment() {
        const input = document.getElementById('commentInput');
        const content = input.value.trim();

        if (!content || !currentPostId) return;

        try {
            const response = await fetch(`/api/posts/${currentPostId}/comments`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ content: content })
            });

            if (!response.ok) throw new Error('댓글 작성 실패');

            const newComment = await response.json();

            // 댓글 목록에 추가
            const container = document.getElementById('modalComments');
            const commentHtml = `
                <div class="post-modal-comment" style="display: flex; gap: 12px;">
                    <img src="${newComment.authorProfileImage || '/images/default-profile.svg'}"
                         class="post-modal-author-pic"
                         alt="프로필">
                    <div style="flex: 1;">
                        <span class="post-modal-author-name">${newComment.authorName}</span>
                        <span class="post-modal-text"> ${newComment.content}</span>
                        <div style="font-size: 12px; color: #8e8e8e; margin-top: 4px;">
                            방금 전
                        </div>
                    </div>
                </div>
            `;
            container.insertAdjacentHTML('beforeend', commentHtml);

            // 입력창 초기화
            input.value = '';
            openPostModal(currentPostId);

        } catch (error) {
            console.error('댓글 작성 실패:', error);
            alert('댓글 작성 중 오류가 발생했습니다.');
        }
    }
</script>

<!--추가된 코드-->

<!-- 게시물 상세 모달 HTML -->
<div id="postModal" class="modal-overlay" onclick="closePostModal(event)">
    <div class="post-modal-container" onclick="event.stopPropagation()">
        <button class="post-modal-close" onclick="closePostModal()">&times;</button>

        <div class="post-modal-content">
            <!-- 왼쪽: 이미지 -->
            <div class="post-modal-image-section">
                <div class="post-modal-slider">
                    <div id="modalSliderWrapper" class="modal-slider-wrapper"></div>
                    <button class="modal-slider-btn modal-slider-prev" id="modalPrevBtn" onclick="moveModalSlide(-1)">
                        ‹
                    </button>
                    <button class="modal-slider-btn modal-slider-next" id="modalNextBtn" onclick="moveModalSlide(1)">›
                    </button>
                </div>
                <div id="modalSliderIndicator" class="modal-slider-indicator"></div>
            </div>

            <!-- 오른쪽: 정보 -->
            <div class="post-modal-info-section">
                <div class="post-modal-header">
                    <div class="post-modal-author">
                        <img id="modalAuthorImage" class="post-modal-author-pic" src="/images/default-profile.svg"
                             alt="프로필">
                        <span id="modalAuthorName" class="post-modal-author-name">작성자</span>
                    </div>
                    <button class="post-modal-more">⋯</button>
                </div>

                <div class="post-modal-body">
                    <div class="post-modal-caption">
                        <img id="modalCaptionImage" class="post-modal-author-pic" src="/images/default-profile.svg"
                             alt="프로필">
                        <div>
                            <span id="modalCaptionName" class="post-modal-author-name">작성자</span>
                            <span id="modalContent" class="post-modal-text">게시물 내용</span>
                        </div>
                    </div>

                    <div id="modalComments" class="post-modal-comments"></div>
                </div>

                <div class="post-modal-footer">
                    <div class="post-modal-actions">
                        <button class="post-modal-action-btn" onclick="togglePostLike()">♡</button>
                        <button class="post-modal-action-btn">💬</button>
                        <button class="post-modal-action-btn">📤</button>
                    </div>

                    <div class="post-modal-likes">
                        좋아요 <span id="modalLikeCount">0</span>개
                    </div>

                    <div class="post-modal-date" id="modalDate">날짜</div>

                    <!-- 댓글 입력 -->
                    <div class="post-modal-comment-input">
                        <input type="text"
                               placeholder="댓글 달기..."
                               id="commentInput"
                               onkeypress="if(event.key==='Enter') addComment()">
                        <button class="post-modal-post-btn" onclick="addComment()">게시</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- 팔로워/팔로잉 모달 HTML -->
<div id="followModal" class="modal-overlay" onclick="closeFollowModal(event)">
    <div class="follow-modal-container" onclick="event.stopPropagation()">
        <div class="follow-modal-header">
            <div class="follow-modal-title" id="followModalTitle">팔로워</div>
            <button class="follow-modal-close" onclick="closeFollowModal()">&times;</button>
        </div>
        <div class="follow-modal-body" id="followModalBody"></div>
    </div>
</div>

<!-- 여기까지 추가 -->
</body>
</html>
