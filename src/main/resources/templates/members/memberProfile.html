<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blink - 프로필</title>

    <!-- 공통 스타일 포함 -->
    <th:block th:replace="~{fragments/styles :: common-styles}"></th:block>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
            background: #fafafa;
        }

        /* 상단바 */
        .top-bar {
            background: white;
            border-bottom: 1px solid #dbdbdb;
            padding: 12px 0;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .top-bar-content {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            font-size: 28px;
            font-weight: bold;
            background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            cursor: pointer;
        }

        .top-actions {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .icon-btn {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .icon-btn:hover {
            transform: scale(1.1);
        }

        /* 프로필 컨테이너 */
        .profile-container {
            max-width: 935px;
            margin: 40px auto;
            padding: 0 20px;
        }

        /* 프로필 헤더 */
        .profile-header {
            display: flex;
            gap: 40px;
            margin-bottom: 44px;
            padding-bottom: 44px;
            border-bottom: 1px solid #dbdbdb;
        }

        .profile-pic-large {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            cursor: pointer;
            transition: transform 0.2s;
            overflow: hidden;
        }

        .profile-pic-large:hover {
            transform: scale(1.05);
        }

        .profile-info {
            flex: 1;
        }

        .profile-top {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 20px;
        }

        .profile-username {
            font-size: 20px;
            font-weight: 300;
            color: #262626;
        }

        .edit-profile-btn,
        .follow-btn {
            padding: 8px 16px;
            border: 1px solid #dbdbdb;
            border-radius: 8px;
            background: white;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .edit-profile-btn:hover,
        .follow-btn:hover {
            background: #fafafa;
        }

        .follow-btn {
            background: #0095f6;
            color: white;
            border: none;
        }

        .follow-btn:hover {
            background: #1877f2;
        }

        .follow-btn.following {
            background: white;
            color: #262626;
            border: 1px solid #dbdbdb;
        }

        .profile-stats {
            display: flex;
            gap: 40px;
            margin-bottom: 20px;
        }

        .stat {
            font-size: 16px;
            color: #262626;
        }

        .stat-number {
            font-weight: 600;
        }

        .profile-bio {
            max-width: 500px;
        }

        .profile-description {
            font-size: 14px;
            color: #262626;
            line-height: 1.5;
            white-space: pre-wrap;
        }

        /* 탭 메뉴 */
        .tabs {
            display: flex;
            justify-content: center;
            border-top: 1px solid #dbdbdb;
            margin-bottom: 20px;
        }

        .tab {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 16px 0;
            margin: 0 30px;
            font-size: 12px;
            font-weight: 600;
            color: #8e8e8e;
            cursor: pointer;
            border-top: 1px solid transparent;
            margin-top: -1px;
            transition: color 0.2s;
        }

        .tab:hover {
            color: #262626;
        }

        .tab.active {
            color: #262626;
            border-top-color: #262626;
        }

        .tab-icon {
            font-size: 14px;
        }

        /* 게시물 그리드 */
        .posts-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 28px;
        }

        .post-item {
            position: relative;
            aspect-ratio: 1;
            background: #f0f0f0;
            cursor: pointer;
            overflow: hidden;
            border-radius: 4px;
        }

        .post-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 30px;
            opacity: 0;
            transition: opacity 0.2s;
        }

        .post-item:hover .post-overlay {
            opacity: 1;
        }

        .post-stat {
            display: flex;
            align-items: center;
            gap: 8px;
            color: white;
            font-weight: 600;
            font-size: 16px;
        }

        /* 빈 상태 */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
        }

        .empty-icon {
            font-size: 80px;
            margin-bottom: 20px;
            opacity: 0.3;
        }

        .empty-title {
            font-size: 28px;
            font-weight: 300;
            color: #262626;
            margin-bottom: 10px;
        }

        .empty-description {
            font-size: 14px;
            color: #8e8e8e;
            margin-bottom: 20px;
        }

        .empty-btn {
            padding: 8px 24px;
            background: #0095f6;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .empty-btn:hover {
            background: #1877f2;
        }

        /* 반응형 */
        @media (max-width: 768px) {
            .profile-header {
                gap: 20px;
            }

            .profile-pic-large {
                width: 100px;
                height: 100px;
            }

            .profile-pic-large .profile-pic-default {
                font-size: 40px;
            }

            .profile-top {
                flex-direction: column;
                align-items: flex-start;
            }

            .profile-stats {
                gap: 20px;
            }

            .posts-grid {
                grid-template-columns: repeat(3, 1fr);
                gap: 4px;
            }

            .tab {
                margin: 0 15px;
            }
        }
    </style>
</head>
<body>
<!-- 상단바 -->
<div class="top-bar">
    <div class="top-bar-content">
        <div class="logo" onclick="alert('홈으로 이동')">Blink</div>
        <div class="top-actions">
            <button class="icon-btn">🏠</button>
            <button class="icon-btn">💬</button>
            <button class="icon-btn">🔔</button>
        </div>
    </div>
</div>

<!-- 프로필 컨테이너 -->
<div th:object="${profile}" class="profile-container">
    <!-- 프로필 헤더 -->
    <div class="profile-header">
        <div class="profile-pic-large" onclick="alert('프로필 사진 변경')">홍</div>

        <div class="profile-info">
            <div class="profile-top">
                <h1 th:text="*{name}" class="profile-username">hong_gildong</h1>
                <!-- 본인 프로필일 때 -->
                <button th:if="*{isMyProfile}" class="edit-profile-btn" onclick="alert('프로필 편집')">프로필 편집</button>
                <button th:if="*{isMyProfile}" class="icon-btn" onclick="alert('설정')">⚙️</button>

                <!-- 다른 사람 프로필일 때 (아래 주석 해제하고 위 버튼들 주석 처리) -->
                <button th:unless="*{isMyProfile}" class="follow-btn" onclick="toggleFollow(this)">팔로우</button>
                <button th:unless="*{isMyProfile}" class="icon-btn" onclick="alert('더보기')">⋯</button>
            </div>

            <div class="profile-stats">
                <div class="stat">
                    게시물 <span class="stat-number" th:text="*{postCount}">42</span>
                </div>
                <div class="stat" style="cursor: pointer;" onclick="alert('팔로워 목록')">
                    팔로워 <span class="stat-number" th:text="*{followerCount}">1,234</span>
                </div>
                <div class="stat" style="cursor: pointer;" onclick="alert('팔로잉 목록')">
                    팔로우 <span class="stat-number" th:text="*{followerCount}">567</span>
                </div>
            </div>

            <div class="profile-bio">
                <!--                <div class="profile-name">홍길동</div>-->
                <div class="profile-description" th:text="*{bio}">안녕하세요! 개발자 홍길동입니다 😊
                    코딩과 여행을 좋아합니다.
                    📍 서울, 대한민국
                </div>
            </div>
        </div>
    </div>

    <!-- 탭 메뉴 -->
    <div class="tabs">
        <div class="tab active" onclick="showTab('posts')">
            <span class="tab-icon">📱</span>
            <span>게시물</span>
        </div>
        <div class="tab" onclick="showTab('saved')">
            <span class="tab-icon">🔖</span>
            <span>저장됨</span>
        </div>
        <div class="tab" onclick="showTab('tagged')">
            <span class="tab-icon">👤</span>
            <span>태그됨</span>
        </div>
    </div>

    <!-- 게시물 탭 -->
    <div id="postsTab" class="tab-content">

        <!-- 게시물이 있을 때 -->
        <div class="posts-grid" th:unless="${#lists.isEmpty(posts)}">
            <div th:each="post : ${posts}" class="post-item"
                 th:onclick="|location.href='/posts/${post.id}'|">

                <!--이미지 있으면 표시-->
                <img th:if="post.imageUrl != null"
                     th:src="${post.imageUrl}" alt="게시물 이미지" class="post-image-img">

                <!--이미지 없으면 기본 아이콘 표시-->
                <div th:unless="${post.imageUrl != null}" class="post-image-default">
                    📸
                </div>

                <div class="post-overlay">
                    <div class="post-stat">
                        <span>❤️</span>
                        <span th:text="${post.likeCount}">1,234</span>
                    </div>
                    <div class="post-stat">
                        <span>💬</span>
                        <span th:text="${post.commentCount}">56</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- 게시물이 없을 때 -->
        <div th:if="${#lists.isEmpty(posts)}" class="empty-state">
            <div class="empty-icon">📷</div>
            <div class="empty-title">게시물 없음</div>
            <div class="empty-description">
                <span th:if="${profile.isMyProfile}">
                    게시물을 공유하면 회원님의 프로필에 표시됩니다.
                </span>
                <span th:unless="${profile.isMyProfile}">
                    아직 게시물이 없습니다.
                </span>
            </div>
            <button th:if="${profile.isMyProfile}"
                    class="empty-btn" onclick="alert('새 게시물 작성')">
                첫 게시물 공유하기
            </button>
        </div>
    </div>

    <!-- 저장됨 탭 -->
    <div id="savedTab" class="tab-content" style="display: none;">
        <div class="empty-state">
            <div class="empty-icon">🔖</div>
            <div class="empty-title">저장한 게시물이 없습니다</div>
            <div class="empty-description">마음에 드는 게시물을 저장하면 여기에 표시됩니다.</div>
        </div>
    </div>

    <!-- 태그됨 탭 -->
    <div id="taggedTab" class="tab-content" style="display: none;">
        <div class="empty-state">
            <div class="empty-icon">👤</div>
            <div class="empty-title">태그된 게시물이 없습니다</div>
            <div class="empty-description">회원님이 태그된 사진과 동영상이 여기에 표시됩니다.</div>
        </div>
    </div>
</div>

<script>
    function showTab(tabName) {
        // 모든 탭 비활성화
        const tabs = document.querySelectorAll('.tab');
        tabs.forEach(tab => tab.classList.remove('active'));

        // 모든 탭 컨텐츠 숨기기
        document.getElementById('postsTab').style.display = 'none';
        document.getElementById('savedTab').style.display = 'none';
        document.getElementById('taggedTab').style.display = 'none';

        // 선택된 탭 활성화
        event.currentTarget.classList.add('active');

        // 해당 컨텐츠 표시
        if (tabName === 'posts') {
            document.getElementById('postsTab').style.display = 'block';
        } else if (tabName === 'saved') {
            document.getElementById('savedTab').style.display = 'block';
        } else if (tabName === 'tagged') {
            document.getElementById('taggedTab').style.display = 'block';
        }
    }
</script>
</body>
</html>
