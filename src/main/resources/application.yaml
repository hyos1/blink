spring:
  messages:
    basename: messages, errors #오류 메세지 errors.properties 등록, messages는 default값
  datasource:
    url:  jdbc:h2:tcp://localhost/~/blink
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create
    properties:
      hibernate:
        format_sql: true
#        default_batch_fetch_size: 100

  # 콘솔 창 색상 설정
  output:
    ansi:
      enabled: always

logging.level:
  org.hibernate.SQL: debug
#  org.hibernate.type: trace #파라미터 바인딩 확인

# 세션 타임아웃 설정
server:
  servlet:
    session:
      timeout: 60